<div class="flex items-start gap-3 p-3 rounded-xl border border-gray-100 bg-gray-50"
     id="address-{{ addr.id }}">

    <span class="text-gray-400 mt-0.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243
                     a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
    </span>

    <div class="flex-1 text-sm text-gray-700 leading-relaxed min-w-0">
        <p>{{ addr.city }}, {{ addr.street }}, д. {{ addr.house }}
        {%- if addr.apartment %}, кв. {{ addr.apartment }}{% endif %}</p>
        {% if addr.comment %}
        <p class="text-xs text-gray-400 mt-0.5">{{ addr.comment }}</p>
        {% endif %}
    </div>

    <div class="flex items-center gap-1 shrink-0">

        {# Edit button #}
        <details class="relative">
            <summary class="list-none cursor-pointer p-1.5 rounded-lg text-gray-400
                            hover:text-orange-500 hover:bg-orange-50 transition-colors select-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5
                             m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </summary>
            <div class="absolute right-0 mt-2 w-72 bg-white rounded-2xl border
                        border-gray-100 shadow-lg p-4 z-10">
                <p class="text-sm font-semibold text-gray-900 mb-3">Редактировать адрес</p>
                <form hx-patch="/profile/addresses/{{ addr.id }}"
                      hx-target="#address-{{ addr.id }}"
                      hx-swap="outerHTML"
                      class="space-y-3">
                    <input type="text" value="{{ addr.city }}" disabled
                           class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-sm
                                  bg-gray-50 text-gray-400 cursor-not-allowed">
                    <input type="text" name="street" value="{{ addr.street }}"
                           placeholder="Улица" required maxlength="150"
                           class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-sm
                                  focus:outline-none focus:ring-2 focus:ring-orange-400
                                  focus:border-transparent placeholder:text-gray-400 transition">
                    <div class="flex gap-2">
                        <input type="text" name="house" value="{{ addr.house }}"
                               placeholder="Дом" required maxlength="20"
                               class="w-1/2 px-3.5 py-2 rounded-xl border border-gray-200 text-sm
                                      focus:outline-none focus:ring-2 focus:ring-orange-400
                                      focus:border-transparent placeholder:text-gray-400 transition">
                        <input type="text" name="apartment" value="{{ addr.apartment or '' }}"
                               placeholder="Квартира (необязательно)" maxlength="20"
                               class="w-1/2 px-3.5 py-2 rounded-xl border border-gray-200 text-sm
                                      focus:outline-none focus:ring-2 focus:ring-orange-400
                                      focus:border-transparent placeholder:text-gray-400 transition">
                    </div>
                    <input type="text" name="comment" value="{{ addr.comment or '' }}"
                           placeholder="Комментарий (необязательно)" maxlength="255"
                           class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-sm
                                  focus:outline-none focus:ring-2 focus:ring-orange-400
                                  focus:border-transparent placeholder:text-gray-400 transition">
                    <button type="submit"
                            class="w-full py-2 bg-orange-500 hover:bg-orange-600 active:bg-orange-700
                                   text-white text-sm font-semibold rounded-xl transition-colors">
                        Сохранить
                    </button>
                </form>
            </div>
        </details>

        {# Delete button #}
        <button hx-delete="/profile/addresses/{{ addr.id }}"
                hx-target="#address-{{ addr.id }}"
                hx-swap="outerHTML"
                hx-confirm="Удалить этот адрес?"
                class="p-1.5 rounded-lg text-gray-400 hover:text-red-500
                       hover:bg-red-50 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858
                         L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </button>

    </div>
</div>
