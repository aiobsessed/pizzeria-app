{% extends "base.html" %}

{% block title %}Регистрация — Пиццерия{% endblock %}

{% block navbar %}
<nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 text-xl font-bold text-orange-500 hover:text-orange-600 transition-colors">
            🍕 Пиццерия
        </a>
        <a href="/login" class="text-sm text-orange-500 hover:text-orange-600 font-medium transition-colors">
            ← Войти
        </a>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Создать аккаунт</h1>
            <p class="mt-1 text-sm text-gray-500">Заполните форму, чтобы создать аккаунт</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            <form action="/register" method="post" class="space-y-5">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Имя</label>
                    <input type="text"
                           name="name"
                           required
                           maxlength="50"
                           placeholder="Как вас зовут?"
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm
                                  focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent
                                  placeholder:text-gray-400 transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                    <input type="email"
                           name="email"
                           required
                           placeholder="mail@example.com"
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm
                                  focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent
                                  placeholder:text-gray-400 transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Телефон</label>
                    <input type="tel"
                           name="phone"
                           required
                           maxlength="20"
                           pattern="\d+"
                           inputmode="numeric"
                           placeholder="79001234567"
                           title="Только цифры, без пробелов и символов"
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm
                                  focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent
                                  placeholder:text-gray-400 transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Пароль</label>
                    <input type="password"
                           name="password"
                           required
                           minlength="8"
                           placeholder="Минимум 8 символов"
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm
                                  focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent
                                  placeholder:text-gray-400 transition">
                </div>

                <button type="submit"
                        class="w-full py-2.5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700
                               text-white text-sm font-semibold rounded-xl transition-colors">
                    Зарегистрироваться
                </button>
            </form>

            <p class="mt-5 text-center text-sm text-gray-500">
                Уже есть аккаунт?
                <a href="/login" class="text-orange-500 hover:text-orange-600 font-medium">Войти</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
