{% extends "base.html" %}

{% block title %}Вход для сотрудников — Пиццерия{% endblock %}

{% block navbar %}
<nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center">
        <span class="flex items-center gap-2 text-xl font-bold text-gray-400">
            🍕 Пиццерия
        </span>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Вход для сотрудников</h1>
            <p class="mt-1 text-sm text-gray-500">Служебный доступ</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            <form action="/staff/login" method="post" class="space-y-5">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">
                        Email или телефон
                    </label>
                    <input type="text"
                           name="login"
                           required
                           placeholder="Служебный логин"
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm
                                  focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent
                                  placeholder:text-gray-400 transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Пароль</label>
                    <input type="password"
                           name="password"
                           required
                           minlength="8"
                           placeholder="Пароль"
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm
                                  focus:outline-none focus:ring-2 focus:ring-gray-400 focus:border-transparent
                                  placeholder:text-gray-400 transition">
                </div>

                <button type="submit"
                        class="w-full py-2.5 bg-gray-800 hover:bg-gray-900 active:bg-black
                               text-white text-sm font-semibold rounded-xl transition-colors">
                    Войти
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
