{#
  Partial: courier/partials/status_toggle.html
  Используется:
    - SSR через {% include %} в courier/index.html
    - HTMX-своп после POST /courier/me/status
  Контекст: courier
#}
<div id="status-toggle">
    <form hx-post="/courier/me/status"
          hx-target="#status-toggle"
          hx-swap="outerHTML">
        {% if courier.is_available %}
        <button type="submit"
                class="flex items-center gap-2 px-4 py-2 bg-green-50 hover:bg-green-100
                       border border-green-300 text-green-700 text-sm font-semibold
                       rounded-xl transition-colors">
            <span class="w-2 h-2 rounded-full bg-green-500"></span>
            Доступен
        </button>
        {% else %}
        <button type="submit"
                class="flex items-center gap-2 px-4 py-2 bg-gray-50 hover:bg-gray-100
                       border border-gray-300 text-gray-600 text-sm font-semibold
                       rounded-xl transition-colors">
            <span class="w-2 h-2 rounded-full bg-gray-400"></span>
            Недоступен
        </button>
        {% endif %}
    </form>
</div>
