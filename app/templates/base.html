<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Пиццерия{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    {% block navbar %}
    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-xl font-bold text-orange-500 hover:text-orange-600 transition-colors">
                🍕 Пиццерия
            </a>
            <div class="flex items-center gap-6">
                {% block nav_links %}{% endblock %}
                <form action="/logout" method="post">
                    <button type="submit"
                            class="text-sm text-gray-500 hover:text-gray-800 transition-colors">
                        Выйти
                    </button>
                </form>
            </div>
        </div>
    </nav>
    {% endblock %}

    {% if flash %}
    <div x-data="{ visible: true }"
         x-show="visible"
         x-init="setTimeout(() => visible = false, 4000)"
         x-transition:leave="transition ease-in duration-300"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-2"
         class="fixed top-4 left-1/2 -translate-x-1/2 z-50 max-w-sm w-full px-5 py-3
                bg-red-50 border border-red-300 text-red-700 text-sm rounded-xl shadow-lg
                flex items-center justify-between gap-4">
        <span>{{ flash }}</span>
        <button @click="visible = false" class="text-red-400 hover:text-red-600 flex-shrink-0">✕</button>
    </div>
    {% endif %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-100 py-5 text-center text-xs text-gray-400">
        © 2025 Пиццерия — Все права защищены
    </footer>

</body>
</html>
